<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fisheries Monitoring Review Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-bg: #0b0f19;
        --color-surface: #151d30;
        --color-surface-hover: #1e2942;
        --color-text: #f8fafc;
        --color-text-muted: #94a3b8;
        --color-accent: #38bdf8;
        --color-accent-600: #0284c7;
        --color-accent-700: #0369a1;
        --color-divider: rgba(255, 255, 255, 0.12);
        --color-danger: #ef4444;
        --color-success: #10b981;
        --color-warning: #f59e0b;
        --color-dolphin: #d946ef;
        
        --font-body: 'Inter', system-ui, -apple-system, sans-serif;
        --font-heading: 'Outfit', 'Inter', system-ui, sans-serif;
        
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 24px;
        --space-6: 32px;
        
        --radius: 8px;
        --radius-lg: 12px;
      }

      * { box-sizing: border-box; }
      body { margin: 0; padding: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); min-height: 100vh; }
      a { color: var(--color-accent); text-decoration: none; }
      a:hover { color: var(--color-accent-600); }
      
      .nav {
        display: flex;
        align-items: center;
        gap: var(--space-4);
        padding: var(--space-3) var(--space-4);
        border-bottom: 1px solid var(--color-divider);
        background: var(--color-bg);
      }
      
      .nav-brand {
        font-family: var(--font-heading);
        font-size: 13px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 600;
      }
      
      .nav a {
        font-size: 13px;
        padding: var(--space-2) var(--space-3);
        border-radius: var(--radius);
        transition: background 0.2s;
        cursor: pointer;
      }
      
      .nav a:hover, .nav a.active {
        background: color-mix(in srgb, var(--color-accent) 10%, transparent);
      }
      
      .tag {
        display: inline-block;
        padding: 4px 8px;
        font-size: 11px;
        letter-spacing: 0.08em;
        border-radius: var(--radius);
        font-weight: 500;
      }
      
      .tag-neutral {
        background: color-mix(in srgb, var(--color-text) 8%, transparent);
        color: var(--color-text);
      }
      
      .tag-accent {
        background: color-mix(in srgb, var(--color-accent) 12%, transparent);
        color: var(--color-accent-700);
      }
      
      .tag-outline {
        background: transparent;
        border: 1px solid var(--color-divider);
        color: var(--color-text);
      }
      
      .btn {
        padding: 8px 14px;
        border: 1px solid var(--color-divider);
        background: transparent;
        color: var(--color-text);
        font-family: var(--font-body);
        font-size: 13px;
        border-radius: var(--radius);
        cursor: pointer;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        gap: var(--space-2);
      }
      
      .btn:hover {
        background: color-mix(in srgb, var(--color-text) 5%, transparent);
        border-color: var(--color-text);
      }
      
      .btn-primary {
        background: var(--color-accent);
        color: white;
        border-color: var(--color-accent);
      }
      
      .btn-primary:hover {
        background: var(--color-accent-600);
      }
      
      .btn-secondary {
        background: transparent;
        border-color: var(--color-divider);
      }
      
      .btn-secondary:hover {
        background: color-mix(in srgb, var(--color-text) 5%, transparent);
      }
      
      .btn-ghost {
        border: none;
        background: transparent;
      }
      
      .btn-ghost:hover {
        background: color-mix(in srgb, var(--color-text) 5%, transparent);
      }
      
      .blueprint {
        position: relative;
        border: 1px solid var(--color-divider);
        background: transparent;
      }
      
      .corner {
        position: absolute;
        width: 12px;
        height: 12px;
        border: 1px solid var(--color-divider);
      }
      
      .corner.tl { top: -1px; left: -1px; border-right: none; border-bottom: none; }
      .corner.tr { top: -1px; right: -1px; border-left: none; border-bottom: none; }
      .corner.bl { bottom: -1px; left: -1px; border-right: none; border-top: none; }
      .corner.br { bottom: -1px; right: -1px; border-left: none; border-top: none; }
      
      .input {
        padding: 8px 12px;
        border: 1px solid var(--color-divider);
        background: var(--color-bg);
        color: var(--color-text);
        font-family: var(--font-body);
        font-size: 13px;
        border-radius: var(--radius);
      }
      
      .input:focus {
        outline: 2px solid var(--color-accent);
        outline-offset: 2px;
      }
      
      .table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      
      .table thead {
        border-bottom: 1px solid var(--color-divider);
      }
      
      .table th {
        padding: var(--space-3);
        text-align: left;
        font-family: var(--font-heading);
        font-weight: 600;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      
      .table td {
        padding: var(--space-3);
        border-bottom: 1px solid color-mix(in srgb, var(--color-text) 5%, transparent);
      }
      
      .table tr:hover {
        background: color-mix(in srgb, var(--color-text) 3%, transparent);
        cursor: pointer;
      }
      
      .seg {
        display: inline-flex;
        border: 1px solid var(--color-divider);
        border-radius: var(--radius);
        overflow: hidden;
      }
      
      .seg-opt {
        padding: 6px 12px;
        background: transparent;
        color: var(--color-text);
        border-right: 1px solid var(--color-divider);
        font-size: 12px;
        cursor: pointer;
        transition: background 0.2s;
        border: none;
      }
      
      .seg-opt:last-child {
        border-right: none;
      }
      
      .seg-opt:hover {
        background: color-mix(in srgb, var(--color-text) 5%, transparent);
      }
      
      .seg-opt.active {
        background: var(--color-accent);
        color: white;
      }
      
      .loading {
        text-align: center;
        padding: var(--space-6);
        opacity: 0.6;
      }
      
      .error {
        background: color-mix(in srgb, #ff6b6b 10%, transparent);
        color: #ff6b6b;
        padding: var(--space-3);
        border-radius: var(--radius);
        border: 1px solid #ff6b6b;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
