# Render Blueprint — https://render.com/docs/blueprint-spec
#
# One Docker web service: Express serves the React bundle, the API, and uploaded
# media.
#
# Free tier, so there is no mounted disk and state is ephemeral: the database is
# reseeded on every boot and uploaded clips do not survive a redeploy or the
# ~15min idle sleep. Fine for a demo. To keep state, see DEPLOY.md.
#
# Detection is OFF here. The image is Node-only and builds in about a minute. The
# app says detection was not run rather than reporting a clean result it never
# computed. Turning it on needs a 4GB plan — see DEPLOY.md.
#
# Deploy: Render Dashboard → New → Blueprint → point at this repo.

services:
  - type: web
    name: fisheries-portal
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Closest Render region to NZ.
    region: singapore
    plan: free
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      # The image already defaults this to false (it tracks what was installed).
      # Stated explicitly so the deployed behaviour is visible here.
      - key: DETECTION_ENABLED
        value: "false"
      # No disk on free, so state lives in the container filesystem and is lost
      # on redeploy. /var/data is still used so that adding a disk later is only
      # a render.yaml change, not an env change.
      - key: DATA_DIR
        value: /var/data
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: RESULTS_DIR
        value: /var/data/results
      # Seeds demo vessels/recordings/flags when the database is empty — which,
      # without a disk, is every boot. This is what keeps the demo populated.
      - key: SEED_ON_START
        value: "true"
